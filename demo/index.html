<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo Embed — Gerador de Exercícios</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 1.5rem auto; padding: 0 1rem; }
    fieldset { margin-bottom: 1rem; }
    label { display: block; margin: 0.4rem 0; }
    button { margin-top: 0.5rem; }
    pre { background: #f4f4f4; padding: 0.75rem; overflow: auto; }
    .err { color: #a00; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Demo local (tracer)</h1>
  <p>POST <code>application/json</code> para <code>/gerar</code> — contrato <code>GenerationRequest</code>.</p>

  <form id="gerar-form">
    <fieldset>
      <legend>Contrato (GenerationRequest)</legend>
      <label>materia <input name="materia" value="Matemática" /></label>
      <label>topico <input name="topico" value="equação do 1º grau" required /></label>
      <label>dificuldade
        <select name="dificuldade">
          <option value="facil">facil</option>
          <option value="medio" selected>medio</option>
          <option value="dificil">dificil</option>
        </select>
      </label>
      <label>quantidade <input name="quantidade" type="number" min="1" max="40" value="2" /></label>
    </fieldset>
    <fieldset>
      <legend>Ambiente (só nesta demo)</legend>
      <p>Estes controles <strong>não</strong> entram no JSON do lote.</p>
      <label>provider
        <select name="provider">
          <option value="">auto</option>
          <option value="openai">openai</option>
          <option value="gemini">gemini</option>
          <option value="grok">grok</option>
        </select>
      </label>
      <label>reasoning
        <select name="reasoning">
          <option value="none">none</option>
          <option value="low">low</option>
          <option value="medium" selected>medium</option>
          <option value="high">high</option>
        </select>
      </label>
    </fieldset>
    <button type="submit" id="submit-btn">Gerar</button>
  </form>

  <div id="error" class="err" hidden></div>
  <pre id="out">Aguardando POST /gerar…</pre>

  <script>
    const form = document.getElementById("gerar-form");
    const out = document.getElementById("out");
    const err = document.getElementById("error");
    const btn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      err.hidden = true;
      err.textContent = "";
      btn.disabled = true;
      btn.textContent = "Gerando…";
      const fd = new FormData(form);
      const payload = {
        materia: fd.get("materia"),
        topico: fd.get("topico"),
        dificuldade: fd.get("dificuldade"),
        quantidade: Number(fd.get("quantidade")),
        provider: fd.get("provider") || "",
        reasoning: fd.get("reasoning") || "medium",
      };
      try {
        const res = await fetch("/gerar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        out.textContent = JSON.stringify(data, null, 2);
        if (!data.ok) {
          err.hidden = false;
          const eobj = data.error || {};
          err.textContent = [eobj.class, eobj.message, eobj.kind].filter(Boolean).join(" — ");
        }
      } catch (ex) {
        err.hidden = false;
        err.textContent = String(ex);
      } finally {
        btn.disabled = false;
        btn.textContent = "Gerar";
      }
    });
  </script>
</body>
</html>
